name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build, test, and pack (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.16.0', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck, build, and test
        run: npm run check

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Check the installed release artifact
        shell: bash
        run: |
          npm pack --json --ignore-scripts > "$RUNNER_TEMP/mnemosyne-pack.json"
          PACK_NAME=$(node -p "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8'))[0].filename" "$RUNNER_TEMP/mnemosyne-pack.json")
          node --input-type=module - "$RUNNER_TEMP/mnemosyne-pack.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          const pack = JSON.parse(readFileSync(process.argv[2], 'utf8'))[0];
          const files = new Set(pack.files.map(file => file.path));
          for (const path of ['README.md', 'LICENSE', 'NOTICE.md', 'docs/deployment.md', 'docs/RUNTIME.md', 'dist/cli/index.js', 'dist/local/index.js', 'dist/mcp/server.js', 'dist/reflection/index.js', 'dist/runtime/index.js', 'dist/http/index.js', 'dist/providers/index.js', 'dist/branches/index.js', 'dist/relations/index.js', 'dist/connectors/index.js', 'dist/adapters/index.js', 'dist/adapters/anthropic-memory.js', 'dist/adapters/provider-memory-tools.js', 'dist/evaluation/learning-demo.js', 'dist/evaluation/index.js', 'dist/evaluation/longmemeval.js', 'python/mnemosyne_memory/__init__.py']) {
            if (!files.has(path)) throw new Error(`Package is missing ${path}`);
          }
          NODE
          MNEMOSYNE_SMOKE_DIR=$(mktemp -d "$RUNNER_TEMP/mnemosyne-package.XXXXXX")
          npm install --prefix "$MNEMOSYNE_SMOKE_DIR" --ignore-scripts --omit=dev --no-audit --no-fund "$PWD/$PACK_NAME"
          "$MNEMOSYNE_SMOKE_DIR/node_modules/.bin/mnemosy" --version
          "$MNEMOSYNE_SMOKE_DIR/node_modules/.bin/mnemosy" demo > "$MNEMOSYNE_SMOKE_DIR/demo.json"
          "$MNEMOSYNE_SMOKE_DIR/node_modules/.bin/mnemosy" learning-demo > "$MNEMOSYNE_SMOKE_DIR/learning-demo.json"
          cd "$MNEMOSYNE_SMOKE_DIR"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { VERSION } from 'mnemosy-ai/mcp';
          const expected = JSON.parse(readFileSync('node_modules/mnemosy-ai/package.json', 'utf8')).version;
          const actual = execFileSync(process.execPath, ['node_modules/mnemosy-ai/dist/cli/index.js', '--version'], { encoding: 'utf8' }).trim();
          if (actual !== expected || VERSION !== expected) throw new Error('Installed package, CLI and MCP versions disagree.');
          NODE
          node --input-type=module -e "await Promise.all(['mnemosy-ai', 'mnemosy-ai/local', 'mnemosy-ai/mcp', 'mnemosy-ai/reflection', 'mnemosy-ai/runtime', 'mnemosy-ai/http', 'mnemosy-ai/providers', 'mnemosy-ai/branches', 'mnemosy-ai/relations', 'mnemosy-ai/connectors', 'mnemosy-ai/adapters', 'mnemosy-ai/evaluation', 'mnemosy-ai/migration', 'mnemosy-ai/maintenance'].map(specifier => import(specifier)));"
          node -e "const report = require('./demo.json'); if (!report.checksTotal || report.checksPassed !== report.checksTotal) process.exit(1); console.log(report.checksPassed + '/' + report.checksTotal + ' demo checks passed');"
          node -e "const report = require('./learning-demo.json'); if (!report.passed || !report.checksTotal || report.checksPassed !== report.checksTotal || report.externalModelCalls !== 0 || report.kind !== 'deterministic integration demonstration') process.exit(1); console.log(report.checksPassed + '/' + report.checksTotal + ' learning integration checks passed');"

      - name: Run the runtime SDK example
        run: node --experimental-strip-types examples/runtime-learning.ts

      - name: Run the native memory command example
        run: node --experimental-strip-types examples/anthropic-memory.ts

      - name: Run the provider memory protocol example
        run: node --experimental-strip-types examples/provider-memory-tools.ts

      - name: Run the migration lifecycle example
        run: node --experimental-strip-types examples/migration.ts

      - name: Run the source freshness and action check example
        run: node --experimental-strip-types examples/maintenance.ts

  python:
    name: Python client (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Test the standard-library client against loopback fixtures
        env:
          PYTHONPATH: python
        run: python -m unittest discover -s python/tests -v
