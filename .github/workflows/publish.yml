name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish to npm (separate from a GitHub release)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    steps:
      - name: Checkout release
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release identity and channel
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const npmVersion = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim();
          const [major, minor, patch] = npmVersion.split('.').map(Number);
          if (![major, minor, patch].every(Number.isInteger)
              || major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
            throw new Error('Trusted publishing requires npm 11.5.1 or newer');
          }
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (pkg.name !== 'mnemosy-ai') throw new Error('Unexpected package name');
          if (`v${pkg.version}` !== process.env.RELEASE_TAG) {
            throw new Error('Release tag must equal v plus package.json version');
          }
          const prerelease = pkg.version.includes('-');
          const tag = prerelease ? 'next' : 'latest';
          appendFileSync(process.env.GITHUB_OUTPUT, `dist-tag=${tag}\n`);
          console.log(`Validated ${pkg.name}@${pkg.version} for npm tag ${tag}`);
          NODE

      # The MCP Registry entry must describe exactly the version published below;
      # a stale server.json stops the job before anything is published.
      - name: Check server.json matches the release
        run: |
          node -e '
          const s = require("./server.json"), p = require("./package.json");
          const pkg = (s.packages || [])[0] || {};
          const problems = [];
          if (s.name !== p.mcpName) problems.push(`server.json name ${s.name} != package.json mcpName ${p.mcpName}`);
          if (s.version !== p.version) problems.push(`server.json version ${s.version} != package.json version ${p.version}`);
          if (pkg.version !== p.version) problems.push(`server.json packages[0].version ${pkg.version} != package.json version ${p.version}`);
          if (pkg.identifier !== p.name) problems.push(`server.json packages[0].identifier ${pkg.identifier} != package.json name ${p.name}`);
          if (problems.length) { console.error(problems.join("\n")); process.exit(1); }
          console.log(`server.json matches ${p.name}@${p.version} (${p.mcpName})`);
          '

      # Fetch and verify the MCP Registry tooling before anything is published, so a
      # tooling failure stops the job before npm and the registry can diverge.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        shell: bash
        env:
          MCP_PUBLISHER_VERSION: v1.8.6
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail -sSL -o "$archive" "$base/$archive"
          curl --fail -sSL -o "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"
          tar xzf "$archive" mcp-publisher
          ./mcp-publisher --version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build the optional native dense index and fetch the pinned local models
        # The test suite gates its hnsw, embedder and reranker tests on these being
        # present and fails when a gate ran nothing, so CI provisions all three.
        env:
          MNEMOSYNE_MODEL_CACHE: ${{ runner.temp }}/mnemosyne-models
        run: |
          npm run build
          npm rebuild hnswlib-node
          npm run setup:embedder
          npm run setup:reranker

      - name: Typecheck, build, and test
        env:
          MNEMOSYNE_MODEL_CACHE: ${{ runner.temp }}/mnemosyne-models
        run: npm run check

      - name: Verify documentation and public metadata
        run: npm run check:docs && npm run check:public

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build and verify the publication artifact
        id: package
        shell: bash
        run: |
          npm pack --json --ignore-scripts > "$RUNNER_TEMP/mnemosyne-pack.json"
          PACK_NAME=$(node -p "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8'))[0].filename" "$RUNNER_TEMP/mnemosyne-pack.json")
          MNEMOSYNE_SMOKE_DIR=$(mktemp -d "$RUNNER_TEMP/mnemosyne-package.XXXXXX")
          trap 'rm -rf "$MNEMOSYNE_SMOKE_DIR"' EXIT
          npm install --prefix "$MNEMOSYNE_SMOKE_DIR" --ignore-scripts --omit=dev --no-audit --no-fund "$PWD/$PACK_NAME"
          node scripts/verify-package.mjs --source package.json \
            --pack "$RUNNER_TEMP/mnemosyne-pack.json" --install "$MNEMOSYNE_SMOKE_DIR" \
            --tarball "$PWD/$PACK_NAME"
          printf 'filename=%s\n' "$PACK_NAME" >> "$GITHUB_OUTPUT"

      # Publish the exact tarball just installed and checked, with no rebuild.
      - name: Publish with provenance
        run: npm publish "$PACK_FILE" --tag "$NPM_DIST_TAG" --access public --provenance
        env:
          PACK_FILE: ${{ steps.package.outputs.filename }}
          NPM_DIST_TAG: ${{ steps.release.outputs.dist-tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # MCP Registry publication runs only after the npm publish above succeeded:
      # the registry checks the mcpName of the published npm version. GitHub OIDC
      # (id-token: write above) authenticates; no token or PAT is stored or used.
      # npm can take minutes to serve a new version (about 3 minutes for
      # 3.0.0-rc.3), so this polls for about 5 minutes: 20 tries, 15 s apart.
      - name: Wait for npm to report the release's mcpName
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          expected=$(node -p 'require("./package.json").mcpName')
          if [ -z "$expected" ] || [ "$expected" = "undefined" ]; then echo "package.json has no mcpName" >&2; exit 1; fi
          tries=20
          for attempt in $(seq 1 "$tries"); do
            actual=$(npm view --prefer-online "mnemosy-ai@${version}" mcpName 2>/dev/null || true)
            if [ "$actual" = "$expected" ]; then
              echo "npm reports mnemosy-ai@${version} mcpName ${actual}"
              exit 0
            fi
            echo "Attempt ${attempt}/${tries}: npm reports mcpName '${actual}', expected '${expected}'"
            [ "$attempt" -lt "$tries" ] && sleep 15
          done
          echo "npm did not report mcpName ${expected} for mnemosy-ai@${version} after ${tries} tries over about 5 minutes" >&2
          exit 1

      - name: Publish to the MCP Registry
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish
