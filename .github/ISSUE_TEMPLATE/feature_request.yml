name: Feature request
description: Describe a use case Mnemosyne should support better
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]

body:
  - type: markdown
    attributes:
      value: |
        Start with the work you need your agent to do and what currently prevents it.
        Review [the current capabilities and remaining work](https://github.com/28naem-del/mnemosyne/blob/main/docs/UPGRADE-STATUS.md) before proposing a change.

        **This issue is public.** Use synthetic examples; do not share credentials, private memories, customer data or production databases. For a confidential integration, custom memory requirement or partnership, contact **28naime@gmail.com** through [Aristotle Intelligence Inc.](https://mnemosy.ai/#company).

  - type: textarea
    id: problem
    attributes:
      label: Problem or missing capability
      description: Explain the concrete task and where the current behavior falls short.
      placeholder: "A procedure has two independent supporting sources. Updating one source retires the procedure even though the other source still supports it."
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired behavior
      description: Describe an observable result that would make the task work better.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Feature area
      multiple: true
      options:
        - Evidence, corrections and conflicts
        - Recall, context and local intelligence
        - Temporal history and freshness
        - Host lifecycle and agent handoffs
        - Observations, profiles and skill trials
        - Gradual migration or full import
        - Scope, privacy and forgetting
        - Backup, recovery and deployment
        - SDK, CLI, MCP, HTTP or Python interfaces
        - Existing vector engine
        - Evaluation and benchmarks
        - Documentation and developer experience
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround and alternatives
      description: Explain what you have tried and the tradeoffs. State if there is no available workaround.

  - type: textarea
    id: validation
    attributes:
      label: How would we verify the improvement?
      description: Suggest a synthetic scenario, failure case or measurable acceptance criterion. Keep retrieval coverage separate from answer correctness.

  - type: textarea
    id: api-sketch
    attributes:
      label: Proposed API or integration sketch
      description: Optional. Include only the relevant interface and synthetic example data.
      render: typescript

  - type: dropdown
    id: impact
    attributes:
      label: Impact on your work
      options:
        - Helpful improvement
        - Requires a workaround today
        - Blocks adoption for my use case
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I reviewed the release status and searched existing issues.
          required: true
        - label: I removed secrets and private data from this request.
          required: true
        - label: I can help test or contribute to this improvement.
          required: false
