services:
  # Attach with `docker compose run --rm -T --no-deps mnemosyne` from an MCP client.
  mnemosyne:
    build:
      context: .
      target: production
    restart: "no"
    init: true
    stdin_open: true
    tty: false
    network_mode: none
    command:
      - mcp
      - --db
      - /data/memory.sqlite
      - --workspace
      - ${MNEMOSYNE_WORKSPACE:-default}
      - --agent
      - ${MNEMOSYNE_AGENT:-docker-agent}
    volumes:
      - local-memory:/data

  # Optional services for applications using createMnemosyne(), not the local MCP server.
  qdrant:
    profiles: [legacy]
    image: qdrant/qdrant:latest
    container_name: mnemosyne-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mnemosyne-net

  # ── Redis (pub/sub broadcast) ─────────────────────────────────────────────────
  redis:
    profiles: [legacy]
    image: redis:7-alpine
    container_name: mnemosyne-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mnemosyne-net

  # ── FalkorDB (knowledge graph) ────────────────────────────────────────────────
  falkordb:
    profiles: [legacy]
    image: falkordb/falkordb:latest
    container_name: mnemosyne-falkordb
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - falkordb-data:/data
    networks:
      - mnemosyne-net

  # ── MongoDB (optional document store) ────────────────────────────────────────
  mongo:
    profiles: [legacy]
    image: mongo:7
    container_name: mnemosyne-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - mnemosyne-net

volumes:
  local-memory:
  # Keep these names unchanged: existing installations may contain live data.
  qdrant-data:
  redis-data:
  falkordb-data:
  mongo-data:

networks:
  mnemosyne-net:
    driver: bridge
