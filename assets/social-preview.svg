    <text x="1224" y="83" text-anchor="end" fill="#9aa9be" font-size="15" letter-spacing="2">MEMORY FOR AI AGENTS</text>
    <text x="56" y="245" fill="#edf2f9" font-size="76" font-weight="500" letter-spacing="-3.5">The next agent</text>
    <text x="56" y="328" fill="#b8f6dd" font-size="76" font-weight="500" letter-spacing="-3.5">starts wiser.</text>
    <text x="60" y="395" fill="#aabace" font-size="23">Remember the work. Verify the lesson.</text>
    <text x="60" y="432" fill="#aabace" font-size="23">Carry it forward.</text>
    <text x="60" y="497" fill="#c1cfde" font-size="14" letter-spacing="1.7">EVIDENCE · CONTINUITY · CONTROL</text>
    <text x="56" y="593" fill="#9aa9be" font-size="15" letter-spacing="1.5">OPEN SOURCE / LOCAL FIRST</text>
    <text x="1224" y="593" text-anchor="end" fill="#b8f6dd" font-size="21">mnemosy.ai</text>
  </g>
