    <radialGradient id="ambient"><stop stop-color="#153e49"/><stop offset="1" stop-color="#070b12"/></radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9ffee"/><stop offset=".48" stop-color="#b8f6dd"/><stop offset="1" stop-color="#719ec0"/></linearGradient>
  </defs>
  <rect width="1280" height="640" fill="#070b12"/>
  <ellipse cx="1000" cy="307" rx="355" ry="330" fill="url(#ambient)"/>
  <path d="M56 124H1224M56 548H1224" stroke="#263141"/>
