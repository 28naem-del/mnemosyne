<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Mnemosyne — the next agent starts wiser.</title>
  <desc id="desc">Persistent memory for AI agents. Remember the work, verify the lesson, carry it forward. Connected mint arches on a dark navy field.</desc>
